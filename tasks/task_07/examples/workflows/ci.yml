# Конвейер эталона (вариант 0). Положите в .github/workflows/ СВОЕГО
# репозитория с каталогами app/ (код + Dockerfile) и infra/.
# Путь коммита: push → тесты → образ:SHA в GHCR → бамп тега в infra →
# дальше Argo CD доводит кластер сам (лекция 22, живой сеанс).
name: smartdom-ci
on:
  push:
    branches: [main]
    paths: [app/**]

permissions:
  contents: write # коммит бампа тега
  packages: write # push в GHCR

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        working-directory: app
        run: |
          pip install -r src/requirements.txt pytest
          pytest || test $? -eq 5   # 5 = тестов нет; для эталона допустимо

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: app
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/telemetry:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Bump image tag in infra
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/telemetry:${{ github.sha }}
          sed -i "s|image: ghcr.io/.*/telemetry:.*|image: $IMAGE|" infra/deployment.yaml
          git config user.name "smartdom-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add infra/deployment.yaml
          git commit -m "ci: telemetry -> ${{ github.sha }}"
          git push
